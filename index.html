<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="green">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1113" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Live TV, India radio and podcasts in one fast mobile web app. Made by DEEPDOTCOM.">
<meta name="author" content="DEEPDOTCOM">
<title>StreamBox — Live TV, Radio &amp; Podcasts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   StreamBox — design tokens
   ============================================================ */
:root{
  --accent:#3ddc84;
  --accent-ink:#04240f;
  --font:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-pill:999px;
  --nav-h:64px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --bg:#0e1113; --bg-2:#0a0d0e;
  --surface:#161b1e; --surface-2:#1d2427; --surface-3:#252e32;
  --text:#e8eef1; --dim:#9aa8af; --dimmer:#6c7a81;
  --border:rgba(255,255,255,.075); --border-strong:rgba(255,255,255,.14);
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --scrim:rgba(4,7,8,.72);
  --glass:rgba(14,17,19,.78);
  --skeleton:rgba(255,255,255,.06);
}
html[data-theme="amoled"]{
  --bg:#000000; --bg-2:#000000;
  --surface:#0b0b0c; --surface-2:#141416; --surface-3:#1d1d20;
  --text:#f2f5f6; --dim:#98a3a8; --dimmer:#6a7478;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.18);
  --shadow:0 10px 30px rgba(0,0,0,.85);
  --scrim:rgba(0,0,0,.8);
  --glass:rgba(0,0,0,.8);
  --skeleton:rgba(255,255,255,.05);
}
html[data-theme="light"]{
  --bg:#f4f7f8; --bg-2:#eef2f4;
  --surface:#ffffff; --surface-2:#eef2f4; --surface-3:#e3e9ec;
  --text:#0f1417; --dim:#5b6b73; --dimmer:#84939a;
  --border:rgba(9,20,26,.09); --border-strong:rgba(9,20,26,.18);
  --shadow:0 8px 24px rgba(12,26,33,.12);
  --scrim:rgba(9,20,26,.45);
  --glass:rgba(244,247,248,.82);
  --skeleton:rgba(9,20,26,.06);
}
/* accent families */
html[data-accent="green"]  {--accent:#3ddc84;--accent-ink:#04240f}
html[data-accent="teal"]   {--accent:#2dd4bf;--accent-ink:#00211d}
html[data-accent="amber"]  {--accent:#f5b840;--accent-ink:#2b1c00}
html[data-accent="orange"] {--accent:#ff8a4c;--accent-ink:#2a1000}
html[data-accent="rose"]   {--accent:#fb7185;--accent-ink:#2c0410}
html[data-accent="blue"]   {--accent:#5aa9ff;--accent-ink:#00182e}
html[data-accent="lime"]   {--accent:#b6e34a;--accent-ink:#1a2400}
html[data-accent="sand"]   {--accent:#d9b48f;--accent-ink:#241503}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overscroll-behavior-y:none; -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:0;height:0}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================================================
   Shell
   ============================================================ */
#app{
  position:fixed;inset:0;display:flex;flex-direction:column;
  background:
    radial-gradient(120% 60% at 50% -10%, color-mix(in srgb, var(--accent) 9%, transparent) 0%, transparent 60%),
    var(--bg);
  overflow:hidden;
}
.topbar{
  flex:0 0 auto;padding:calc(var(--sat) + 10px) 14px 8px;
  display:flex;align-items:center;gap:6px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid var(--border);z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#000));
  display:grid;place-items:center;color:var(--accent-ink);
  box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent);
}
.brand-mark svg{width:20px;height:20px}
.brand-txt{min-width:0}
.brand-title{font-size:16px;font-weight:600;letter-spacing:-.2px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--dim);letter-spacing:.02em;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{
  width:40px;height:40px;border-radius:var(--r-pill);display:grid;place-items:center;
  color:var(--text);position:relative;overflow:hidden;flex:0 0 auto;
  transition:background .18s var(--ease);
}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.iconbtn .dot{position:absolute;top:9px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--accent)}

.content{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + var(--sab) + 18px);position:relative;z-index:1}
.content.with-mini{padding-bottom:calc(var(--nav-h) + var(--sab) + 92px)}
.view{display:none;animation:viewIn .26s var(--ease)}
.view.active{display:block}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* search field */
.searchwrap{padding:10px 14px 4px;display:flex;gap:8px;align-items:center}
.search{
  flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r-pill);padding:0 14px;height:44px;
  transition:border-color .2s, background .2s;
}
.search:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent);
  background:var(--surface-2)}
.search svg{width:18px;height:18px;color:var(--dim);flex:0 0 auto}
.search input{flex:1;background:none;border:0;outline:none;font-size:14.5px;min-width:0}
.search input::placeholder{color:var(--dimmer)}
.search .clr{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--dim);background:var(--surface-3)}
.search .clr svg{width:14px;height:14px}
.viewtoggle{width:44px;height:44px;border-radius:var(--r-pill);background:var(--surface);
  border:1px solid var(--border);display:grid;place-items:center;color:var(--dim);flex:0 0 auto}
.viewtoggle svg{width:19px;height:19px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.chip{
  flex:0 0 auto;padding:8px 15px;border-radius:var(--r-pill);background:var(--surface);
  border:1px solid var(--border);font-size:13px;font-weight:500;color:var(--dim);
  white-space:nowrap;transition:all .18s var(--ease);display:flex;align-items:center;gap:6px;
}
.chip.active{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.chip .cnt{font-family:var(--mono);font-size:10.5px;opacity:.65}
.chip:active{transform:scale(.97)}

/* section head */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 16px 10px}
.sechead h2{font-size:15.5px;margin:0;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.sechead h2::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--accent)}
.sechead .link{font-size:12.5px;color:var(--dim);font-weight:500}
.meta-row{padding:0 16px 6px;font-size:12px;color:var(--dimmer);display:flex;gap:10px;align-items:center}

/* ============================================================
   Cards / lists
   ============================================================ */
.grid{display:grid;gap:12px;padding:6px 14px 8px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);overflow:hidden;text-align:left;width:100%;
  transition:transform .16s var(--ease), border-color .16s;
}
.card:active{transform:scale(.975);border-color:var(--border-strong)}
.card .thumb{position:relative;aspect-ratio:16/9;background:var(--surface-2);overflow:hidden}
.card .thumb img{width:100%;height:100%;object-fit:contain;padding:10px}
.card .thumb .fallback{
  position:absolute;inset:0;display:grid;place-items:center;
  font-weight:700;font-size:22px;letter-spacing:-.5px;color:#fff;
  text-shadow:0 1px 6px rgba(0,0,0,.35);
}
.card .badge{
  position:absolute;top:7px;left:7px;display:flex;align-items:center;gap:4px;
  padding:3px 7px;border-radius:6px;font-size:9.5px;font-weight:700;letter-spacing:.06em;
  background:rgba(6,10,12,.72);color:#fff;backdrop-filter:blur(6px);text-transform:uppercase;
}
.card .badge.live::before{content:"";width:5px;height:5px;border-radius:50%;background:#ff4d4f;
  animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.card .fav{
  position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;background:rgba(6,10,12,.55);color:#fff;backdrop-filter:blur(6px);
  opacity:.9;
}
.card .fav svg{width:14px;height:14px}
.card .fav.on{color:var(--accent)}
.card .cbody{padding:9px 10px 11px}
.card .cname{font-size:12.8px;font-weight:600;line-height:1.28;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.card .csub{font-size:10.5px;color:var(--dimmer);margin-top:4px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;font-family:var(--mono)}
.card.playing{border-color:var(--accent)}
.card.playing::after{content:"";position:absolute;inset:0;border-radius:inherit;
  border:1.5px solid var(--accent);pointer-events:none}

/* list rows */
.rows{display:flex;flex-direction:column;padding:2px 10px 8px}
.row{
  display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:var(--r-sm);
  width:100%;text-align:left;position:relative;
}
.row:active{background:var(--surface-2)}
.row .av{
  width:46px;height:46px;border-radius:13px;flex:0 0 auto;overflow:hidden;position:relative;
  background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;
}
.row .av img{width:100%;height:100%;object-fit:cover;padding:4px}
.row .rbody{min-width:0;flex:1}
.row .rname{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rsub{font-size:11.5px;color:var(--dimmer);margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.row .rtail{flex:0 0 auto;color:var(--dimmer);font-size:11px;font-family:var(--mono);display:flex;
  align-items:center;gap:8px}
.row .rtail .fav svg{width:18px;height:18px}
.row.playing .rname{color:var(--accent)}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:2.5px;background:var(--accent);border-radius:2px;animation:eq .9s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}
.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:13px}}

/* ============================================================
   Bottom navigation
   ============================================================ */
.nav{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  height:calc(var(--nav-h) + var(--sab));padding-bottom:var(--sab);
  background:var(--glass);backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border-top:1px solid var(--border);z-index:30;
}
.navitem{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:100%;color:var(--dim);position:relative;transition:color .2s;
}
.navitem .pill{
  display:grid;place-items:center;width:52px;height:29px;border-radius:var(--r-pill);
  transition:background .22s var(--ease), transform .22s var(--ease);
}
.navitem svg{width:21px;height:21px}
.navitem span{font-size:10px;font-weight:500;letter-spacing:.01em}
.navitem.active{color:var(--text)}
.navitem.active .pill{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.navitem.active span{color:var(--accent);font-weight:600}
.navitem:active .pill{transform:scale(.92)}

/* ============================================================
   Mini player
   ============================================================ */
.mini{
  position:fixed;left:8px;right:8px;bottom:calc(var(--nav-h) + var(--sab) + 8px);
  height:64px;border-radius:var(--r-md);background:var(--surface-2);
  border:1px solid var(--border-strong);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:11px;padding:0 8px 0 10px;z-index:35;
  transform:translateY(calc(100% + 96px));opacity:0;pointer-events:none;
  transition:transform .3s var(--ease), opacity .2s var(--ease);
}
.mini.show{transform:none;opacity:1;pointer-events:auto}
.mini .mav{width:44px;height:44px;border-radius:11px;overflow:hidden;background:var(--surface-3);
  display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px;flex:0 0 auto}
.mini .mav img{width:100%;height:100%;object-fit:cover}
.mini .mtxt{flex:1;min-width:0}
.mini .mt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mini .mprog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--surface-3);
  border-radius:0 0 var(--r-md) var(--r-md);overflow:hidden}
.mini .mprog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s linear}

/* ============================================================
   Buttons
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 20px;border-radius:var(--r-pill);font-size:14px;font-weight:600;
  background:var(--surface-2);color:var(--text);border:1px solid var(--border);
  transition:transform .15s var(--ease), filter .15s;
}
.btn svg{width:18px;height:18px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{background:color-mix(in srgb,#ff4d4f 16%,transparent);color:#ff6b6d;border-color:color-mix(in srgb,#ff4d4f 32%,transparent)}
.btn.block{width:100%}
.btn.sm{height:36px;padding:0 14px;font-size:12.5px}
.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--sab) + 20px);width:56px;height:56px;
  border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%,transparent);z-index:36;
  transition:transform .2s var(--ease);
}
.fab:active{transform:scale(.93)}
.fab svg{width:26px;height:26px}

/* ============================================================
   Settings rows
   ============================================================ */
.group{margin:6px 14px 16px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);overflow:hidden}
.group-title{padding:16px 18px 8px;font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dimmer)}
.srow{display:flex;align-items:center;gap:13px;padding:13px 16px;width:100%;text-align:left;
  border-bottom:1px solid var(--border);position:relative}
.srow:last-child{border-bottom:0}
.srow:active{background:var(--surface-2)}
.srow .sic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--surface-2);color:var(--accent)}
.srow .sic svg{width:18px;height:18px}
.srow .stxt{flex:1;min-width:0}
.srow .stitle{font-size:14px;font-weight:500}
.srow .ssub{font-size:11.5px;color:var(--dimmer);margin-top:2px;line-height:1.35}
.srow .sval{font-size:12.5px;color:var(--dim);font-family:var(--mono);max-width:46%;
  text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow svg.chev{width:18px;height:18px;color:var(--dimmer);flex:0 0 auto}
.switch{
  width:46px;height:28px;border-radius:var(--r-pill);background:var(--surface-3);
  border:2px solid var(--border-strong);position:relative;flex:0 0 auto;transition:all .22s var(--ease);
}
.switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
  background:var(--dim);transition:all .22s var(--ease)}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on i{left:20px;background:var(--accent-ink)}

/* ============================================================
   Sheets, dialogs, toast
   ============================================================ */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:95;
  opacity:0;pointer-events:none;transition:opacity .24s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:96;background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.4);
  transform:translateY(102%);transition:transform .3s var(--ease);
  max-height:88dvh;display:flex;flex-direction:column;padding-bottom:var(--sab);
}
.sheet.show{transform:none}
.sheet .grab{width:34px;height:4px;border-radius:2px;background:var(--surface-3);margin:10px auto 4px;flex:0 0 auto}
.sheet .shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px 12px;flex:0 0 auto}
.sheet .shead h3{margin:0;font-size:17px;font-weight:600;letter-spacing:-.2px}
.sheet .sbody{overflow-y:auto;padding:0 0 18px;flex:1 1 auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.dialog{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);z-index:97;
  width:min(92vw,420px);background:var(--surface);border-radius:var(--r-xl);padding:22px 20px 16px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .22s var(--ease);
  border:1px solid var(--border-strong);max-height:86dvh;overflow-y:auto;
}
.dialog.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.dialog h3{margin:0 0 6px;font-size:18px;letter-spacing:-.2px}
.dialog p{margin:0 0 16px;font-size:13.5px;color:var(--dim);line-height:1.5}
.dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dimmer);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;height:46px;border-radius:var(--r-sm);background:var(--surface-2);
  border:1px solid var(--border);padding:0 13px;font-size:14px;outline:none;transition:border-color .2s;
}
.field textarea{height:auto;min-height:96px;padding:12px 13px;resize:vertical;font-family:var(--mono);
  font-size:12px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field .hint{font-size:11px;color:var(--dimmer);margin-top:5px;line-height:1.4}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-pill);padding:3px;gap:2px}
.seg button{flex:1;height:36px;border-radius:var(--r-pill);font-size:12.5px;font-weight:500;color:var(--dim)}
.seg.wrap{flex-wrap:wrap;border-radius:var(--r-md)}
.seg.wrap button{flex:1 1 30%;height:34px;font-size:12px;border-radius:10px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--sab) + 26px);transform:translate(-50%,20px);
  background:var(--surface-3);color:var(--text);padding:12px 18px;border-radius:var(--r-sm);
  font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:all .25s var(--ease);
  box-shadow:var(--shadow);max-width:88vw;text-align:center;border:1px solid var(--border-strong);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.player-open .toast{bottom:auto;top:calc(var(--sat) + 72px);transform:translate(-50%,-10px)}
body.player-open .toast.show{transform:translate(-50%,0)}

/* ============================================================
   Player
   ============================================================ */
#player{
  position:fixed;inset:0;z-index:80;background:#000;display:none;
  flex-direction:column;
}
#player.open{display:flex}
#player .stage{position:relative;flex:1;background:#000;overflow:hidden;display:grid;place-items:center}
#player video{width:100%;height:100%;background:#000;object-fit:contain}
#player.audio-mode #video{visibility:hidden}
#player.audio-only #video{visibility:hidden}
#player video.cover{object-fit:cover}
#player video.fill{object-fit:fill}
#player video.zoom{object-fit:cover;transform:scale(1.18)}
.pctl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  opacity:1;transition:opacity .25s;z-index:5}
.pctl.hide{opacity:0;pointer-events:none}
.ptop{display:flex;align-items:flex-start;gap:10px;padding:calc(var(--sat) + 10px) 12px 26px;
  background:linear-gradient(180deg,rgba(0,0,0,.78),transparent)}
.ptop .info{flex:1;min-width:0;color:#fff}
.ptop .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 4px rgba(0,0,0,.5)}
.ptop .s{font-size:11.5px;opacity:.75;margin-top:2px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.pbtm{padding:30px 14px calc(var(--sab) + 14px);
  background:linear-gradient(0deg,rgba(0,0,0,.86),transparent);color:#fff}
.pscrub{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10.5px;opacity:.85}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:22px;background:transparent;width:100%;outline:none;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--accent) var(--p,0%),rgba(255,255,255,.25) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--accent);margin-top:-4.5px;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.25)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:var(--accent)}
.pbtns{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.pbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;
  transition:background .18s,transform .15s}
.pbtn:active{transform:scale(.9);background:rgba(255,255,255,.12)}
.pbtn svg{width:23px;height:23px}
.pbtn.big{width:60px;height:60px;background:var(--accent);color:var(--accent-ink)}
.pbtn.big svg{width:28px;height:28px}
.pbtn.sm{width:40px;height:40px;opacity:.9}
.pbtn.sm svg{width:19px;height:19px}
.pcenter-state{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6}
.spinner{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.16);
  border-top-color:var(--accent);animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.perror{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:30px;text-align:center;color:#fff;z-index:6;background:rgba(0,0,0,.62);pointer-events:auto}
.perror svg{width:40px;height:40px;opacity:.7}
.perror .m{font-size:14px;font-weight:600}
.perror .d{font-size:12px;opacity:.65;line-height:1.5;max-width:320px}
.perror .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.audio-cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;padding:40px;text-align:center;
  background:radial-gradient(70% 50% at 50% 30%, color-mix(in srgb,var(--accent) 24%,transparent), transparent 70%), #07090a}
.audio-cover .art{width:min(58vw,220px);aspect-ratio:1;border-radius:26px;overflow:hidden;
  background:var(--surface-3);display:grid;place-items:center;font-size:52px;font-weight:700;color:#fff;
  box-shadow:0 24px 60px rgba(0,0,0,.6)}
.audio-cover .art img{width:100%;height:100%;object-fit:cover}
.audio-cover .an{font-size:19px;font-weight:600;color:#fff;max-width:86%}
.audio-cover .as{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:4px}
.pmenu{position:absolute;right:12px;bottom:calc(var(--sab) + 96px);background:rgba(20,24,26,.96);
  backdrop-filter:blur(16px);border-radius:var(--r-md);padding:6px;z-index:9;min-width:190px;
  border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 40px rgba(0,0,0,.6);display:none}
.pmenu.show{display:block}
.pmenu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:9px;
  color:#fff;font-size:13px;text-align:left}
.pmenu button:active{background:rgba(255,255,255,.1)}
.pmenu button svg{width:17px;height:17px;opacity:.8}
.pmenu button.on{color:var(--accent)}
.pmenu .ph{padding:8px 12px 4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4)}

/* splash */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);
  transition:opacity .4s,visibility .4s}
#splash.gone{opacity:0;visibility:hidden}
#splash .wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
#splash .mark{width:74px;height:74px;border-radius:24px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 40%,#000));
  color:var(--accent-ink);box-shadow:0 16px 44px color-mix(in srgb,var(--accent) 32%,transparent);
  animation:pop .5s var(--ease)}
#splash .mark svg{width:40px;height:40px}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
#splash .n{font-size:19px;font-weight:600;letter-spacing:-.3px}
#splash .t{font-size:12px;color:var(--dimmer);letter-spacing:.16em;text-transform:uppercase}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 30px;text-align:center}
.empty svg{width:44px;height:44px;color:var(--dimmer)}
.empty .m{font-size:14.5px;font-weight:600}
.empty .d{font-size:12.5px;color:var(--dimmer);line-height:1.55;max-width:300px}

/* stat pills */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 14px 4px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px}
.stat .v{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:-.5px}
.stat .k{font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.09em;margin-top:3px}


/* ============================================================
   v2 polish: rails, cards, refined surfaces
   ============================================================ */
.sechead h2{font-size:16px}
.sechead .link{color:var(--dim);background:var(--surface);border:1px solid var(--border);
  padding:5px 11px;border-radius:var(--r-pill);font-size:11.5px;font-weight:500}
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 14px 14px;scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail-item{flex:0 0 40%;max-width:170px;scroll-snap-align:start;min-width:0}
.rail .card{border-radius:var(--r-md)}
.rail .card .cname{font-size:12px;min-height:0;-webkit-line-clamp:1}
.rail .card .thumb{aspect-ratio:16/10}

.card{border-radius:18px}
@media (hover:hover){
  .card:hover{transform:translateY(-2px);border-color:var(--border-strong)}
  .row:hover{background:var(--surface-2)}
}
.card .fallback svg{width:30px;height:30px;opacity:.92;filter:drop-shadow(0 1px 4px rgba(0,0,0,.25))}
.card .badge.warn{background:rgba(245,184,64,.92);color:#2b1c00}
.card .badge.tb{background:rgba(90,169,255,.9);color:#00182e}

.seasonhead{padding:14px 12px 6px;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dimmer)}

.chip{box-shadow:inset 0 0 0 1px transparent}
.chip.active{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 26%,transparent)}
.navitem.active .pill{animation:pillIn .28s var(--ease)}
@keyframes pillIn{from{transform:scale(.86)}to{transform:scale(1)}}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.skeleton{background:linear-gradient(100deg,var(--skeleton) 20%,var(--surface-2) 38%,var(--skeleton) 56%);
  background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:var(--r-md);height:96px}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-40% 0}}

.srow .stitle{letter-spacing:-.1px}
.group{border-radius:20px}
.btn{letter-spacing:-.1px}
.mini{backdrop-filter:blur(18px)}
.topbar{padding-bottom:10px}
.meta-row{font-family:var(--mono);font-size:11px;letter-spacing:.01em}
.empty{padding:46px 26px}
.empty .m{font-size:15px}


/* ============================================================
   v3: logo plates, live thumbnails, collections
   ============================================================ */
.card .thumb{background:linear-gradient(160deg,var(--surface-2),var(--surface))}
.av{position:relative}
.plate{position:absolute;left:13%;right:13%;top:12%;bottom:12%;border-radius:16px;
  display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(168deg,#ffffff,#e9eef2);
  box-shadow:0 6px 16px rgba(0,0,0,.30),inset 0 0 0 1px rgba(0,0,0,.05)}
.plate img{max-width:76%;max-height:72%;object-fit:contain;
  filter:drop-shadow(0 2px 5px rgba(0,0,0,.10));transition:transform .3s var(--ease)}
.card:active .plate img{transform:scale(.95)}
.plate .mono{font-weight:800;font-size:21px;letter-spacing:-.04em;line-height:1;
  padding:0 4px;text-align:center}
.plate.has-logo .mono{display:none}
.plate.small{left:0;right:0;top:0;bottom:0;border-radius:12px;box-shadow:none}
.plate.small .mono{font-size:14px}
.plate.small img{max-width:80%;max-height:76%}
.row .av{background:linear-gradient(160deg,var(--surface-2),var(--surface))}
.row .av svg{width:18px;height:18px}
.srow .sic svg,.iconbtn svg{flex:0 0 auto}

.card .badge.col{background:rgba(12,17,20,.82);color:#fff;text-transform:none;letter-spacing:0;
  font-weight:600;font-size:9.5px;display:flex;align-items:center;gap:3px}
.card .badge.col svg{width:11px;height:11px}
.card .badge.vod{background:rgba(90,169,255,.92);color:#00182e;text-transform:none;letter-spacing:0}

.thumbcard .thumb{background:#0b0f11}
.thumbcard video.pv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .45s var(--ease);background:#000;z-index:2}
.thumbcard video.pv.on{opacity:1}
.thumbcard.previewing .plate{opacity:0}
.thumbcard.previewing .badge{z-index:3}
.thumbcard.previewing .fav{z-index:3}
.grid-thumb .card .thumb{aspect-ratio:16/9}
.grid-thumb .card .cbody{padding:8px 10px 10px}

/* player channel chip */
.pchip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;
  background:rgba(255,255,255,.12);font-size:10px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:#fff;margin-top:5px}
.pchip i{width:5px;height:5px;border-radius:50%;background:#ff4d4f;animation:blink 1.6s infinite}


/* ============================================================
   v4: explore, posters, details, extensions
   ============================================================ */
.prail{display:flex;gap:12px;overflow-x:auto;padding:2px 14px 16px;scroll-snap-type:x proximity}
.prail::-webkit-scrollbar{display:none}
.pcard{flex:0 0 33%;max-width:130px;scroll-snap-align:start;min-width:0;text-align:left}
.pcard .pimg{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;
  background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--border)}
.pcard .pimg img{width:100%;height:100%;object-fit:cover}
.pcard .pimg .mono{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;
  font-size:22px;color:var(--dimmer);letter-spacing:-.03em}
.pcard .ptitle{font-size:12px;font-weight:600;margin-top:7px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pmeta{font-size:10.5px;color:var(--dimmer);margin-top:2px;font-family:var(--mono)}
.pcard:active{transform:scale(.97)}

.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:6px;
  font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:var(--surface-2);color:var(--dim);border:1px solid var(--border)}
.tag.st{color:#a78bfa;border-color:rgba(167,139,250,.35)}
.tag.pt{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.tag.cs{color:#5aa9ff;border-color:rgba(90,169,255,.35)}
.tag.nv{color:#f5b840;border-color:rgba(245,184,64,.35)}
.tag.loc{color:var(--dim)}

.hero{position:relative;margin:0 0 8px;padding:0}
.hero .hb{position:relative;height:190px;overflow:hidden;background:var(--surface-2)}
.hero .hb img{width:100%;height:100%;object-fit:cover;opacity:.85}
.hero .hf{position:absolute;inset:0;background:linear-gradient(0deg,var(--surface) 4%,transparent 70%)}
.hero .ht{padding:0 18px;margin-top:-46px;position:relative}
.hero h2{margin:0;font-size:21px;letter-spacing:-.4px;line-height:1.2}
.hero .hm{font-size:11.5px;color:var(--dim);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero .hd{font-size:12.8px;line-height:1.62;color:var(--dim);padding:12px 18px 4px;max-height:120px;overflow:hidden}
.hero .hact{display:flex;gap:8px;padding:12px 18px 16px}

.ext-empty{padding:30px 24px;text-align:center;color:var(--dimmer);font-size:12.5px;line-height:1.6}
.ext-row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.ext-row:last-child{border-bottom:0}
.ext-row .eic{width:40px;height:40px;border-radius:11px;background:var(--surface-2);overflow:hidden;
  display:grid;place-items:center;flex:0 0 auto;color:var(--accent)}
.ext-row .eic img{width:100%;height:100%;object-fit:cover}
.ext-row .etx{flex:1;min-width:0}
.ext-row .et{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.ext-row .es{font-size:11px;color:var(--dimmer);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ext-row .ea{display:flex;gap:2px;flex:0 0 auto}
.streamrow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
.streamrow .sbody{flex:1;min-width:0}
.streamrow .sn{font-size:13.5px;font-weight:600}
.streamrow .sd{font-size:11px;color:var(--dimmer);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insight{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 96px);text-align:center;color:rgba(255,255,255,.6);
  font-size:10.5px;font-family:var(--mono);pointer-events:none;z-index:4}


/* credit line — force a colour-emoji font so 💌 renders everywhere */
.credit{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--r-pill);
  background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:12px;
  font-weight:600;letter-spacing:.02em;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",var(--font)}
.credit b{color:var(--accent);font-weight:700;letter-spacing:.04em}

/* ============================================================
   v5: TV guide grid + channel numbers
   ============================================================ */
#guide{position:fixed;inset:0;z-index:78;background:var(--bg);display:none;flex-direction:column}
#guide.open{display:flex}
.ghead{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) 12px 10px;
  border-bottom:1px solid var(--border);background:var(--glass);backdrop-filter:blur(16px)}
.gtt{font-size:16px;font-weight:600;letter-spacing:-.2px}
.gsub{font-size:11px;color:var(--dimmer);font-family:var(--mono);margin-top:2px}
.gscroll{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#gBody{position:relative;min-width:max-content;padding-bottom:40px}
.gruler,.grow{display:flex;height:62px;border-bottom:1px solid var(--border)}
.gruler{height:34px;position:sticky;top:0;background:var(--surface);z-index:4}
.gchan{width:132px;flex:0 0 132px;display:flex;align-items:center;gap:8px;padding:0 8px;
  position:sticky;left:0;background:var(--surface);z-index:3;border-right:1px solid var(--border)}
.gchan.gh{font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.08em}
.glogo{width:34px;height:34px;border-radius:9px;position:relative;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.glogo .plate{left:0;right:0;top:0;bottom:0;border-radius:9px;box-shadow:none}
.glogo .plate .mono{font-size:11px}
.gcn{font-size:10.5px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gtrack{position:relative;flex:0 0 auto;height:100%}
.gtick{position:absolute;top:10px;font-size:9.5px;color:var(--dimmer);font-family:var(--mono);padding-left:5px;border-left:1px solid var(--border);height:24px}
.gprog{position:absolute;top:7px;bottom:7px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);
  padding:5px 7px;overflow:hidden;cursor:pointer;transition:background .15s}
.gprog:active{background:var(--surface-3)}
.gprog .gpt{display:block;font-size:10.5px;font-weight:600;line-height:1.25;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gprog .gpm{display:block;font-size:9px;color:var(--dimmer);font-family:var(--mono);margin-top:2px}
.gprog.live{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface-2))}
.gprog.past{opacity:.55}
.gnow{position:absolute;top:0;bottom:0;width:2px;background:#ff4d4f;z-index:2;box-shadow:0 0 8px rgba(255,77,79,.6)}
body.guide-open .nav{display:none}
body.guide-open .content{padding-bottom:0}
.pnum{position:absolute;top:6px;left:6px;padding:1px 5px;border-radius:5px;background:rgba(8,12,14,.62);
  color:#fff;font-size:9px;font-family:var(--mono);z-index:2}
.meta-btns{display:flex;gap:6px;margin-left:auto}
.meta-btns .mb{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--r-pill);
  background:var(--surface);border:1px solid var(--border);color:var(--dim);font-size:10.5px;font-weight:600}
.meta-btns .mb svg{width:12px;height:12px}


/* ============================================================
   v6: stats pill, NEW badge, a11y, density, wide layout
   ============================================================ */
.pstats{position:absolute;top:calc(var(--sat) + 56px);right:10px;z-index:6;display:none;
  padding:4px 9px;border-radius:8px;background:rgba(6,10,12,.62);backdrop-filter:blur(8px);
  color:#fff;font-size:9.5px;font-family:var(--mono);letter-spacing:.02em;pointer-events:none}
.card .badge.new{background:rgba(61,220,132,.92);color:#04240f}

/* accessibility mode */
html.a11y{--r-sm:14px;--r-md:18px}
html.a11y body{font-size:17px}
html.a11y .card .cname,html.a11y .row .rname{font-size:15px}
html.a11y .row .rsub,html.a11y .card .csub{font-size:12.5px}
html.a11y .srow .stitle{font-size:15.5px}
html.a11y .srow .ssub{font-size:13px}
html.a11y .navitem span{font-size:11px}
html.a11y .chip{font-size:14px;padding:9px 17px}
html.a11y .border,html.a11y .card,html.a11y .group,html.a11y .search{border-color:var(--border-strong)}
html.a11y .iconbtn{width:46px;height:46px}

/* density */
html[data-density="compact"] .grid{gap:8px;padding:4px 10px 6px}
html[data-density="compact"] .card .cbody{padding:6px 8px 8px}
html[data-density="compact"] .card .cname{font-size:12px;min-height:0;-webkit-line-clamp:1}
html[data-density="compact"] .card .csub{font-size:10px;margin-top:2px}
html[data-density="compact"] .row{padding:6px 8px}

function parseM3U(text, srcId) {

    if (!s) continue;
    const up = s.toUpperCase();
    if (up.indexOf('#EXTINF') === 0) {
      const body = s.slice(s.indexOf(':') + 1);
      const comma = body.lastIndexOf(',');
      const attrStr = comma > -1 ? body.slice(0, comma) : body;
      const title = comma > -1 ? body.slice(comma + 1).trim() : '';
      const attrs = {};
      const re = /([a-zA-Z0-9_.-]+)="([^"]*)"/g; let m;
      while ((m = re.exec(attrStr))) attrs[m[1].toLowerCase()] = m[2];
      let name = title || attrs['tvg-name'] || attrs['tvg-id'] || 'Channel';
      name = name.replace(/\s*\[[^\]]*\]\s*$/, '').trim();
      cur = {
        name: name,
        logo: attrs['tvg-logo'] || attrs['logo'] || '',
        group: attrs['group-title'] || group || '',
        tvgId: attrs['tvg-id'] || '',
        url: '', ua: null, referer: null, src: srcId,
        catchup: (attrs['catchup'] || attrs['catchup-type']) ? {
          type: attrs['catchup'] || attrs['catchup-type'] || 'default',
          source: attrs['catchup-source'] || '',

        } : null
      };
    } else if (up.indexOf('#EXTGRP:') === 0) {
      group = s.slice(8).trim(); if (cur) cur.group = group;
    } else if (up.indexOf('#EXTVLCOPT:') === 0 || up.indexOf('#KODIPROP:') === 0) {
      const low = s.toLowerCase();
      if (low.indexOf('http-user-agent') > -1) ua = s.split('=').slice(1).join('=').trim();
      if (low.indexOf('http-referrer') > -1 || low.indexOf('http-referer') > -1) referer = s.split('=').slice(1).join('=').trim();
      if (cur) { cur.ua = ua; cur.referer = referer; }
    } else if (up.indexOf('#') === 0) {
      continue;
    } else {
      if (!cur) { cur = { name: s.split('/').pop().replace(/\.[a-z0-9]+$/i, '') || 'Stream', logo: '', group: group, url: '', src: srcId }; }

  });

}

/* JSON playlists: accepts arrays, {channels:[…]}, {groups:[{name,channels}]},

function parseJSONPlaylist(text, srcId) {
  let j = null;
  const clean = String(text).replace(/^\uFEFF/, '').trim();
  try { j = JSON.parse(clean); } catch (e) {
    const a = clean.indexOf('{'), b = clean.lastIndexOf('}');
    const c = clean.indexOf('['), d = clean.lastIndexOf(']');
    const s = (a > -1 && b > a) ? clean.slice(a, b + 1) : (c > -1 && d > c ? clean.slice(c, d + 1) : null);
    if (!s) return [];
    try { j = JSON.parse(s); } catch (e2) { return []; }
  }
  const out = [], seen = {};
  const URL_KEYS = ['url', 'link', 'stream', 'stream_url', 'streamUrl', 'src', 'file', 'download_url', 'direct_source', 'url_stream', 'playlist_url', 'source'];
  const NAME_KEYS = ['name', 'title', 'channel', 'tvg_name', 'tvg-name', 'label', 'file_name', 'filename', 'display_name'];
  const LOGO_KEYS = ['logo', 'icon', 'image', 'tvg_logo', 'tvg-logo', 'thumbnail', 'poster', 'thumb'];
  const GROUP_KEYS = ['group', 'category', 'group_title', 'group-title', 'genre', 'section'];
  const pick = (o, keys) => { for (let i = 0; i < keys.length; i++) { const v = o[keys[i]]; if (typeof v === 'string' && v.trim()) return v.trim(); } return ''; };

  const COL_KEYS = ['files', 'episodes', 'chapters', 'children', 'seasons', 'items', 'tracks', 'videos', 'parts', 'links', 'list'];
  function collectionOf(node) {
    for (let i = 0; i < COL_KEYS.length; i++) {
      const v = node[COL_KEYS[i]];
      if (Array.isArray(v) && v.length > 1) {
        const eps = [];
        v.forEach((e) => {
          if (!e || typeof e !== 'object') return;
          const u = pick(e, URL_KEYS);
          if (u && /^https?:\/\//i.test(u)) eps.push({ name: pick(e, NAME_KEYS) || ('Episode ' + (eps.length + 1)), url: u, logo: pick(e, LOGO_KEYS) });
        });
        if (eps.length > 1) return eps;
      }
    }
    return null;
  }
  function add(o, group) {
    let url = pick(o, URL_KEYS);
    if (!url && typeof o.tvg === 'object' && o.tvg) url = pick(o.tvg, URL_KEYS);
    if (!url || !/^https?:\/\//i.test(url)) return false;
    if (seen[url]) return false;
    seen[url] = 1;
    let name = pick(o, NAME_KEYS);
    if (!name) { try { name = decodeURIComponent(url.split('/').pop().split('?')[0]) || 'Stream'; } catch (e) { name = 'Stream'; } }
    out.push({
      name: name, url: url, logo: pick(o, LOGO_KEYS),
      group: pick(o, GROUP_KEYS) || group || '',
      tvgId: pick(o, ['tvg_id', 'tvg-id', 'epg_channel_id']),
      ua: pick(o, ['user_agent', 'userAgent', 'ua']) || null,
      src: srcId
    });
    return true;
  }
  function walk(node, group, depth) {
    if (node == null || depth > 7) return;
    if (typeof node === 'string') { if (/^https?:\/\//i.test(node)) add({ url: node }, group); return; }
    if (Array.isArray(node)) { for (let i = 0; i < node.length; i++) walk(node[i], group, depth + 1); return; }
    if (typeof node !== 'object') return;
    const col = collectionOf(node);
    if (col && !pick(node, URL_KEYS)) {
      const nm = pick(node, NAME_KEYS) || pick(node, GROUP_KEYS) || 'Collection';
      out.push({
        name: nm, url: 'collection:' + normName(nm) + ':' + out.length, logo: pick(node, LOGO_KEYS),
        group: pick(node, GROUP_KEYS) || group || 'Collections', tvgId: '', ua: null, src: srcId,
        kind: 'collection', col: col
      });
      return;
    }
    const added = add(node, group);
    const label = pick(node, NAME_KEYS) || pick(node, GROUP_KEYS) || '';
    Object.keys(node).forEach(function (k) {
      const v = node[k];
      if (!v || typeof v !== 'object') return;
      if (added && Array.isArray(v) && k.toLowerCase() === 'sources') return;
      let g = group;
      if (Array.isArray(v)) g = pick(node, GROUP_KEYS) || label || k;
      else g = pick(v, GROUP_KEYS) || pick(v, NAME_KEYS) || group || k;
      walk(v, g, depth + 1);
    });
  }
  walk(j, '', 0);
  return out;
}

function parseAnyPlaylist(text, srcId) {
  const head = String(text).slice(0, 900);
  const low = head.toLowerCase();
  const trimmed = head.trim();
  if (trimmed.charAt(0) === '{' || trimmed.charAt(0) === '[') {
    const js = parseJSONPlaylist(text, srcId);
    if (js.length) return js;
  }
  if (low.indexOf('[playlist]') > -1) return parsePLS(text, srcId);
  if (low.indexOf('<asx') > -1) return parseASX(text, srcId);
  if (low.indexOf('<playlist') > -1 && low.indexOf('xspf') > -1) return parseXSPF(text, srcId);
  if (low.indexOf('#extm3u') > -1 || low.indexOf('#extinf') > -1) return parseM3U(text, srcId);
  const urls = String(text).split(/\r?\n/).map((s) => s.trim()).filter((s) => /^https?:\/\//i.test(s));
  if (urls.length) return urls.map((u) => ({ name: u.split('/').pop().split('?')[0] || u, logo: '', group: '', url: u, src: srcId, ua: null }));
  const js = parseJSONPlaylist(text, srcId);
  if (js.length) return js;
  return parseM3U(text, srcId);
}

/* ---------- logos ---------- */
function normName(s) {
  return String(s || '').toLowerCase()
    .replace(/\b(hd|fhd|uhd|sd|4k|1080p|720p|576p|360p|240p)\b/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
function logoFor(item) {
  if (item && item.logo) return item.logo;
  if (item && DB && DB.logos) {
    const custom = DB.logos[normName(item.name)];
    if (custom) return custom;
  }
  const map = window.LOGO_MAP || {};
  const n = normName(item && item.name);
  if (map[n]) return map[n];
  const compact = n.replace(/\s+/g, '');
  const keys = Object.keys(map);
  for (let i = 0; i < keys.length; i++) if (keys[i].replace(/\s+/g, '') === compact) return map[keys[i]];
  return '';
}

/* ---------- DRM sniffing (a browser can play Widevine only with a licence server) ---------- */
function looksEncrypted(text) {
  if (!text) return false;
  const head = text.slice(0, 6000);
  return /#EXT-X-KEY:[^\n]*METHOD=(SAMPLE-AES|SAMPLE-AES-CTR|ISO-23001-7)/i.test(head) ||
    /widevine|com\.widevine\.alpha|playready|clearkey/i.test(head);
}

const EP_RE = /^(.*?)[\s._\-]*?(?:s(\d{1,2})[\s._\-]*e(\d{1,3})|ep?[\s._\-]*(\d{1,3})|episode[\s._\-]*(\d{1,3})|part[\s._\-]*(\d{1,3})|(\d{1,3}))$/i;
function episodeInfo(name) {
  const base = String(name || '').replace(/\.(mp4|mkv|avi|m3u8|ts)$/i, '').trim();
  let m = /^(.*?)[\s._\-]*s(\d{1,2})[\s._\-]*e(\d{1,3})\b/i.exec(base);
  if (m) return { base: m[1].trim(), season: +m[2], num: +m[3] };
  m = /^(.*?)[\s._\-]*(?:episode|ep\.?)[\s._\-]*(\d{1,3})\b/i.exec(base);
  if (m) return { base: m[1].trim(), season: 1, num: +m[2] };
  m = /^(.*?)[\s._\-]*part[\s._\-]*(\d{1,3})\b/i.exec(base);
  if (m) return { base: m[1].trim(), season: 1, num: +m[2] };
  m = /^(.*?)[\s._\-]+(\d{1,3})$/.exec(base);
  if (m && m[1].trim().length > 3) return { base: m[1].trim(), season: 1, num: +m[2] };
  return null;
}
function autoCollect(items) {
  const groups = {}, order = [];
  items.forEach((it) => {
    const info = episodeInfo(it.name);
    if (!info) return;
    const key = normName(info.base);
    if (!key || key.length < 3) return;
    if (!groups[key]) { groups[key] = { base: info.base, eps: [] }; order.push(key); }
    groups[key].eps.push(Object.assign({}, it, { _s: info.season, _n: info.num }));
  });
  const out = [];
  const used = {};
  items.forEach((it) => { used[it.url] = it; });
  const consumed = {};
  Object.keys(groups).forEach((k) => {
    const g = groups[k];
    if (g.eps.length < 2) return;
    g.eps.sort((a, b) => a._s - b._s || a._n - b._n);
    g.eps.forEach((e) => { consumed[e.url] = 1; });
    const first = g.eps[0];
    out.push({
      name: g.base, url: 'collection:' + k, logo: first.logo || '',
      group: first.group || 'Series', tvgId: '', ua: null, src: first.src,
      kind: 'collection', cat: first.cat,
      col: g.eps.map((e) => ({ name: e.name, url: e.url, logo: e.logo || '' }))
    });
  });
  const rest = items.filter((it) => !consumed[it.url]);
  return out.concat(rest);
}

function fmtBytes(n) {
  if (!n) return '';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (v >= 10 ? Math.round(v) : v.toFixed(1)) + ' ' + u[i];
}

    catchup: o.catchup || null

}

function buildLibrary() {
  const tv = [], radio = [], seen = new Set();
  const hidden = new Set(DB.hidden || []);
  // preloaded TV
  if ((DB.sources.find((s) => s.id === 'seed-tv') || {}).enabled !== false) {
    (window.SEED_TV || []).forEach((t) => {
      const it = mkItem({ name: t.n, url: t.u, group: t.c, cat: t.c, src: 'seed-tv', ua: t.a }, 'tv');
      if (seen.has(it.id) || hidden.has(it.id)) return; seen.add(it.id); tv.push(it);
    });
  }
  // preloaded radio
  if ((DB.sources.find((s) => s.id === 'seed-radio') || {}).enabled !== false) {
    (window.SEED_RADIO || []).forEach((r) => {
      const it = mkItem({ name: r.n, url: r.u, group: r.c, cat: r.c, src: 'seed-radio' }, 'radio');
      if (seen.has(it.id) || hidden.has(it.id)) return; seen.add(it.id); radio.push(it);
    });
  }
  // user / fetched sources
  DB.sources.forEach((s) => {
    if (s.type === 'builtin' || !s.enabled || !Array.isArray(s.items)) return;
    s.items.forEach((c) => {
      const it = mkItem({ name: c.name, url: c.url, logo: c.logo, group: c.group, cat: c.cat, tvgId: c.tvgId, src: s.id, ua: c.ua, xt: c.xt, movie: c.movie, col: c.col, catchup: c.catchup }, c.kind || 'tv');
      if (!it.url) return;
      if (seen.has(it.id) || hidden.has(it.id)) return;
      seen.add(it.id);
      if (it.kind === 'radio') radio.push(it); else tv.push(it);
    });
  });
  // custom radio stations
  DB.customRadio.forEach((r) => {
    const it = mkItem({ name: r.name, url: r.url, group: r.group || 'My stations', cat: r.group || 'My stations', src: 'custom-radio' }, 'radio');
    if (!seen.has(it.id)) { seen.add(it.id); radio.push(it); }
  });
  // radio-browser cache
  if (DB.cacheRadio && Array.isArray(DB.cacheRadio.items)) {
    DB.cacheRadio.items.forEach((r) => {
      const it = mkItem({ name: r.name, url: r.url, logo: r.logo, group: r.group || 'India', cat: r.group || 'India', src: 'radio-browser' }, 'radio');
      if (!seen.has(it.id)) { seen.add(it.id); radio.push(it); }
    });
  }
  const sortBy = DB.settings.sortBy;
  const sorter = (a, b) => {
    if (sortBy === 'group') return a.group.localeCompare(b.group) || a.name.localeCompare(b.name);
    return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
  };
  tv.sort(sorter); radio.sort(sorter);

  // alternates: same channel name with several URLs -> failover list
  const byName = {};
  tv.forEach((it) => { const k = normName(it.name); (byName[k] = byName[k] || []).push(it); });
  Object.keys(byName).forEach((k) => {
    const g = byName[k];
    if (g.length < 2) return;
    g.forEach((it) => { it.alts = g.filter((x) => x !== it).map((x) => x.url).slice(0, 6); });
  });

  // channel numbers (user pins win)
  tv.forEach((it, i) => { it.num = DB.nums[it.id] || (i + 1); });
  radio.forEach((it, i) => { it.num = DB.nums[it.id] || (i + 1); });

  // "new since last refresh"
  const newUrls = {};
  DB.sources.forEach((src) => { if (src.newUrls) src.newUrls.forEach((u) => { newUrls[u] = 1; }); });
  tv.concat(radio).forEach((it) => { it.isNew = !!newUrls[it.url]; });

  STATE.channels = tv; STATE.radio = radio;

  // podcasts
  const pods = [];
  (window.SEED_PODS || []).forEach((p, i) => {
    const id = 'sp' + i;
    const feed = (DB.podFeeds || {})[id] || p.feed || '';
    pods.push(Object.assign({ id: id, kind: 'pod', src: 'seed-pod' }, p, feed ? { feed: feed } : {}));
  });
  DB.customPods.forEach((p) => pods.push(Object.assign({ id: 'cp' + hash(p.feed), kind: 'pod', src: 'custom-pod' }, p)));
  STATE.pods = pods;
  STATE.epg = DB.epg && DB.epg.data ? DB.epg.data : null;
}

/* ---------- favourites ---------- */
function isFav(kind, id) { return (DB.favs[kind] || []).indexOf(id) > -1; }
function toggleFav(kind, id) {
  const arr = DB.favs[kind] = DB.favs[kind] || [];
  const i = arr.indexOf(id);
  if (i > -1) { arr.splice(i, 1); toast('Removed from favourites'); }
  else { arr.unshift(id); toast('Added to favourites'); }
  save(true);
}
function findItem(id) {
  return STATE.channels.find((c) => c.id === id) || STATE.radio.find((c) => c.id === id) || STATE.pods.find((c) => c.id === id) || null;
}
function pushRecent(item) {
  DB.recents = (DB.recents || []).filter((r) => r.id !== item.id);
  DB.recents.unshift({ id: item.id, name: item.name, kind: item.kind, logo: item.logo || '', url: item.url, at: Date.now() });

}

/* ---------- cards ---------- */
function plateHTML(it, cls) {
  const logo = DB.settings.showLogos ? logoFor(it) : '';

    '<span class="mono" style="color:' + col + '">' + esc(initials(it.name)) + '</span></div>';
}
function cardHTML(it, opts) {
  opts = opts || {};
  const isCol = it.kind === 'collection';
  const kindFav = it.kind === 'radio' ? 'radio' : 'tv';
  const fav = isFav(kindFav, it.id);

  else if (it.kind === 'series') badge = '<span class="badge col">Series</span>';

  return '<div class="card' + (thumbMode ? ' thumbcard' : '') + '" role="button" tabindex="0" data-play="' + it.id + '">' +
    '<div class="thumb">' +

    '</div>' +
    '<div class="cbody"><div class="cname">' + esc(it.name) + '</div>' +
    '<div class="csub">' + esc(now || (isCol ? (it.col ? it.col.length + ' episodes' : 'Collection') : it.group)) + '</div></div></div>';
}
function shade(hex) {
  try {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.max(0, (n >> 16) - 55), g = Math.max(0, ((n >> 8) & 255) - 55), b = Math.max(0, (n & 255) - 55);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  } catch (e) { return hex; }
}
function rowHTML(it) {
  const playing = STATE.playingId === it.id;
  const kindFav = it.kind === 'radio' ? 'radio' : 'tv';
  const fav = isFav(kindFav, it.id);

    '<button class="fav" data-fav="' + it.id + '" data-kind="' + kindFav + '" style="width:34px;height:34px;border-radius:50%;color:' + (fav ? 'var(--accent)' : 'var(--dimmer)') + ';background:none;position:static">' + icon(fav ? 'starFill' : 'star') + '</button>' +
    '</div></div>';
}

/* ---------- filtering ---------- */
function filterList(list, q, cat) {
  const qq = q.trim().toLowerCase();
  return list.filter((it) => {
    if (DB.settings.hideAdult && /(adult|xxx|18\+|erotic|brazz|playboy)/i.test(it.name + ' ' + (it.group || '') + ' ' + (it.cat || ''))) return false;
    if (cat === 'Favourites' || cat === 'Favorites') { if (!isFav(it.kind, it.id)) return false; }
    else if (cat && cat.indexOf('g:') === 0) {
      const g = (DB.groups || []).find((x) => x.id === cat.slice(2));
      if (!g || g.items.indexOf(it.id) === -1) return false;
    }
    else if (cat === 'New') { if (!it.isNew) return false; }
    else if (cat && cat !== 'All') {
      if ((it.cat || '') !== cat && (it.group || '') !== cat) return false;
    }
    if (!qq) return true;
    return (it.name + ' ' + (it.group || '') + ' ' + (it.cat || '')).toLowerCase().indexOf(qq) > -1;
  });
}
function chipsFor(list, key) {
  const counts = {};
  list.forEach((it) => { const k = it.cat || it.group || 'Other'; counts[k] = (counts[k] || 0) + 1; });
  const cats = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const favs = list.filter((it) => isFav(it.kind, it.id)).length;
  let html = '<button class="chip ' + (STATE.cat[key] === 'All' ? 'active' : '') + '" data-cat="' + key + '" data-val="All">' + t('All') + ' <span class="cnt">' + list.length + '</span></button>';
  if (favs) html += '<button class="chip ' + (STATE.cat[key] === 'Favourites' ? 'active' : '') + '" data-cat="' + key + '" data-val="Favourites">' + icon('starFill') + ' ' + t('Favourites') + ' <span class="cnt">' + favs + '</span></button>';
  const newCount = list.filter((it) => it.isNew).length;
  if (newCount) html += '<button class="chip ' + (STATE.cat[key] === 'New' ? 'active' : '') + '" data-cat="' + key + '" data-val="New">' + t('New') + ' <span class="cnt">' + newCount + '</span></button>';
  (DB.groups || []).forEach((g) => {
    const n = list.filter((it) => g.items.indexOf(it.id) > -1).length;
    if (!n) return;
    html += '<button class="chip ' + (STATE.cat[key] === 'g:' + g.id ? 'active' : '') + '" data-cat="' + key + '" data-val="g:' + g.id + '">' + esc(g.name) + ' <span class="cnt">' + n + '</span></button>';
  });
  cats.forEach((c) => {
    html += '<button class="chip ' + (STATE.cat[key] === c ? 'active' : '') + '" data-cat="' + key + '" data-val="' + esc(c) + '">' + esc(c) + ' <span class="cnt">' + counts[c] + '</span></button>';
  });
  return html;
}

const FEATURED_NAMES = ['dd national', 'dd news', 'aaj tak', 'ndtv 24x7', 'republic bharat', 'india today', 'abp news',

function railsHTML() {
  let html = '';

/* ---------- choose sheet ---------- */
function chooseSheet(title, options, current, cb) {
  const html = options.map((o) =>
    '<button class="srow" data-choice="' + esc(o[0]) + '"><div class="stxt"><div class="stitle">' + esc(o[1]) + '</div>' + (o[2] ? '<div class="ssub">' + esc(o[2]) + '</div>' : '') + '</div>' +
    (o[0] === current ? '<span style="color:var(--accent)">' + icon('check') + '</span>' : '') + '</button>').join('');
  openSheet(title, html, {
    onOpen: (root) => {
      $$('[data-choice]', root).forEach((b) => b.addEventListener('click', () => {
        closeSheet(); cb(b.dataset.choice);
      }));
    }
  });
}

/* ---------- apply settings ---------- */
function applyTheme() {
  const s = DB.settings;
  let theme = s.theme;
  if (theme === 'system') theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-accent', s.accent);
  document.documentElement.setAttribute('data-density', s.density || 'comfortable');
  document.documentElement.classList.toggle('a11y', !!s.a11y);
  const meta = $('#metaTheme');
  const bg = theme === 'light' ? '#f4f7f8' : theme === 'amoled' ? '#000000' : '#0e1113';
  if (meta) meta.setAttribute('content', bg);
  document.documentElement.style.removeProperty('--accent');
}
function setSetting(key, val) {
  DB.settings[key] = val; save(true); applyTheme();
}

      '<button class="iconbtn" data-src-refresh="' + s.id + '" style="width:34px;height:34px">' + icon('refresh') + '</button>' +
      '<div class="switch ' + (on ? 'on' : '') + '" data-src-toggle="' + s.id + '"><i></i></div>' +

    '<div style="padding:8px 16px 20px;display:flex;gap:8px"><button class="btn primary" style="flex:1" data-act="add-playlist">' + icon('plus') + ' Add playlist</button>' +

    onOpen: (root) => {
      $$('[data-src-toggle]', root).forEach((b) => b.addEventListener('click', () => {
        const s = DB.sources.find((x) => x.id === b.dataset.srcToggle);
        s.enabled = !(s.enabled !== false);
        if (s.enabled && s.type !== 'builtin' && !s.items) refreshSource(s);
        save(true); openPlaylists(); buildLibrary(); renderAll();
      }));
      $$('[data-src-refresh]', root).forEach((b) => b.addEventListener('click', () => {
        const s = DB.sources.find((x) => x.id === b.dataset.srcRefresh);
        refreshSource(s);

        });

    }
  });
}

async function refreshSource(src) {
  if (!src) return;
  if (src.type === 'builtin') { buildLibrary(); renderAll(); return toast(src.name + ' is built in — nothing to refresh'); }
  toast('Loading ' + src.name + '…');
  try {
    if (src.type === 'm3u') {
      const txt = await fetchText(src.url, { timeout: (DB.settings.timeout || 20) * 1000 });
      let items = parseAnyPlaylist(txt, src.id).map((c) => ({
        name: c.name, url: c.url, logo: c.logo, group: c.group, tvgId: c.tvgId, ua: c.ua,
        kind: c.kind || 'tv', col: c.col || null, catchup: c.catchup || null
      }));
      if (!items.length) throw new Error('No channels found');
      items = autoCollect(items);
      const cols = items.filter((i) => i.kind === 'collection').length;
      const before = {};
      (src.items || []).forEach((i) => { before[i.url] = 1; });
      src.newUrls = items.filter((i) => i.url && !before[i.url]).map((i) => i.url).slice(0, 400);
      src.items = items.slice(0, 4000);
      src.sub = items.length + ' items' + (cols ? ' · ' + cols + ' collections' : '') + (items.length > 4000 ? ' (first 4000)' : '');
      src.failed = false;
      src.updatedAt = Date.now();
      // grab EPG url from #EXTM3U x-tvg-url
      const m = /x-tvg-url="([^"]+)"/i.exec(txt);
      if (m && !DB.settings.epgUrl) { DB.settings.epgUrl = m[1]; loadEPG(m[1], true); }
      save(true); buildLibrary(); renderAll();
      toast(items.length + ' items' + (src.newUrls && src.newUrls.length ? ' · ' + src.newUrls.length + ' new' : ''));
    } else if (src.type === 'xtream') {
      const base = src.host.replace(/\/+$/, '');
      const u = encodeURIComponent(src.user), pw = encodeURIComponent(src.pass);
      const api = (extra) => fetchText(base + '/player_api.php?username=' + u + '&password=' + pw + (extra || ''), { timeout: 25000 });
      const jget = (txt) => { try { return JSON.parse(txt); } catch (e) { throw new Error('Provider returned invalid JSON — check the server URL'); } };

      const info = jget(await api(''));
      const user = (info && info.user_info) || {};
      if (info && info.user_info && String(user.auth) === '0') throw new Error('Login rejected — check username / password');
      src.info = {
        status: user.status || '', exp: user.exp_date ? new Date(+user.exp_date * 1000) : null,
        max: user.max_connections || '', active: user.active_cons || '', tz: user.timezone || ''
      };

      const grab = async (catAct, listAct) => {
        let cats = [], list = [];
        try { cats = jget(await api('&action=' + catAct)); } catch (e) { cats = []; }
        try { list = jget(await api('&action=' + listAct)); } catch (e) { list = []; }
        const names = {}; (Array.isArray(cats) ? cats : []).forEach((c) => { names[c.category_id] = c.category_name; });
        return { names: names, list: Array.isArray(list) ? list : [] };
      };

      const live = await grab('get_live_categories', 'get_live_streams');
      if (!live.list.length && !user.username) throw new Error('No streams returned — check credentials');
      const items = live.list.map((s) => ({
        name: s.name, logo: s.stream_icon || '', group: live.names[s.category_id] || 'Live',
        tvgId: s.epg_channel_id || '',
        url: base + '/live/' + u + '/' + pw + '/' + s.stream_id + '.m3u8', kind: 'tv'
      }));

      let vodCount = 0, serCount = 0;
      if (DB.settings.xtreamVod !== false) {
        const vod = await grab('get_vod_categories', 'get_vod_streams');
        vod.list.forEach((m) => {
          const ext = (m.container_extension || 'mp4').toLowerCase();
          if (['mp4', 'm4v', 'webm', 'mkv', 'avi'].indexOf(ext) === -1) return;
          vodCount++;
          items.push({
            name: m.name, logo: m.stream_icon || (m.movie_image || ''), group: vod.names[m.category_id] || 'Movies',
            cat: 'Movies · ' + (vod.names[m.category_id] || 'VOD'),
            url: base + '/movie/' + u + '/' + pw + '/' + m.stream_id + '.' + ext, kind: 'tv', movie: true
          });
        });
        const ser = await grab('get_series_categories', 'get_series');
        ser.list.forEach((x) => {
          serCount++;
          items.push({
            name: x.name, logo: x.cover || '', group: ser.names[x.category_id] || 'Series',
            cat: 'Series · ' + (ser.names[x.category_id] || 'All'),
            url: 'xtream:series:' + x.series_id, kind: 'series',
            xt: { host: base, user: src.user, pass: src.pass, seriesId: x.series_id, srcId: src.id }
          });
        });
      }

      src.items = items.slice(0, 6000);
      src.sub = 'Xtream · ' + live.list.length + ' live' + (vodCount ? ' · ' + vodCount + ' movies' : '') + (serCount ? ' · ' + serCount + ' series' : '');
      src.updatedAt = Date.now();
      save(true); buildLibrary(); renderAll();
      toast('Xtream: ' + live.list.length + ' live, ' + vodCount + ' movies, ' + serCount + ' series');
    } else if (src.type === 'json') {
      const txt = await fetchText(src.url, { timeout: (DB.settings.timeout || 20) * 1000 });
      let items = parseJSONPlaylist(txt, src.id).map((c) => ({
        name: c.name, url: c.url, logo: c.logo, group: c.group, tvgId: c.tvgId, ua: c.ua,
        kind: c.kind || 'tv', col: c.col || null
      }));
      if (!items.length) throw new Error('No streams found in that JSON');
      items = autoCollect(items);
      const cols = items.filter((i) => i.kind === 'collection').length;
      const eps = items.reduce((n, i) => n + (i.col ? i.col.length : 0), 0);
      src.items = items.slice(0, 5000);
      src.sub = items.length + ' items · JSON' + (cols ? ' · ' + cols + ' collections (' + eps + ' episodes)' : '');
      src.updatedAt = Date.now();
      save(true); buildLibrary(); renderAll();
      toast(items.length + ' items loaded from JSON');
    }
  } catch (e) {
    src.failed = true;
    src.sub = 'Failed · ' + (e.message || 'network error');
    save(true);
    if (STATE.tab === 'settings') renderSettings();
    toast('Failed: ' + (e.message || 'network error'));
    console.warn('[StreamBox] source error', e);
  }
}

/* ---------- radio browser ---------- */
async function syncRadioBrowser() {
  if (STATE.busy.radio) return;
  STATE.busy.radio = true;
  toast('Syncing India stations…');
  const hosts = ['https://de1.api.radio-browser.info', 'https://de2.api.radio-browser.info', 'https://at1.api.radio-browser.info', 'https://nl1.api.radio-browser.info'];
  let data = null;
  for (const h of hosts) {
    try {
      const txt = await fetchText(h + '/json/stations/bycountrycodeexact/' + (DB.settings.radioCountry || 'IN') + '?limit=500&order=clickcount&reverse=true&hidebroken=true', { timeout: 15000 });
      const arr = JSON.parse(txt);
      if (Array.isArray(arr) && arr.length) { data = arr; break; }
    } catch (e) { }
  }
  STATE.busy.radio = false;
  if (!data) return toast('Could not reach the radio catalogue');
  const items = data.filter((s) => s.url_resolved || s.url).map((s) => ({
    name: (s.name || 'Station').trim(),
    url: s.url_resolved || s.url,
    logo: s.favicon || '',
    group: (s.tags || '').split(',').filter(Boolean)[0] || 'India'
  })).filter((s) => /^https?:\/\//i.test(s.url));
  DB.cacheRadio = { ts: Date.now(), items: items.slice(0, 500) };
  save(true); buildLibrary(); renderRadio(); toast(items.length + ' stations synced');
}

/* ---------- podcasts ---------- */
function itunes(term, limit) {
  const url = 'https://itunes.apple.com/search?term=' + encodeURIComponent(term) + '&entity=podcast&country=in&limit=' + (limit || 25);
  return jsonp(url).then((r) => (r && r.results) || []).catch(() =>
    fetchText(url, { timeout: 12000 }).then((t) => (JSON.parse(t).results) || [])
  );
}
async function openPodcast(p) {
  openSheet(p.name, '<div style="padding:0 18px 18px"><div class="spinner" style="margin:20px auto"></div></div>');

    let feed = p.feed || (DB.podFeeds || {})[p.id];

    const xml = await fetchText(feed, { timeout: 20000 });

    p.feed = feed; p.artwork = art; p.author = author;
    DB.podFeeds = DB.podFeeds || {};
    DB.podFeeds[p.id] = feed;
    if (art) p.artwork = art;
    save();
    const html = '<div style="display:flex;gap:12px;padding:0 18px 14px;align-items:center">' +
      '<div class="av" style="width:64px;height:64px;border-radius:16px;background:var(--surface-3);overflow:hidden;display:grid;place-items:center">' +
      (art ? '<img src="' + esc(art) + '" style="width:100%;height:100%;object-fit:cover">' : esc(initials(p.name))) + '</div>' +
      '<div style="min-width:0"><div style="font-size:14px;font-weight:600">' + esc(p.name) + '</div>' +
      '<div style="font-size:11.5px;color:var(--dim);margin-top:2px">' + esc(author || '') + ' · ' + eps.length + ' episodes</div></div></div>' +

function parseRSS(xml) {
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('Invalid feed');
  const nodes = Array.from(doc.querySelectorAll('item, entry'));
  const tag = (n, name) => {
    let x = null;
    try { x = n.querySelector(name); } catch (e) { x = null; }
    if (!x) { try { x = n.getElementsByTagName(name)[0] || null; } catch (e) { x = null; } }
    return x;
  };
  return nodes.map((n) => {
    const get = (name) => { const x = tag(n, name); return x ? (x.textContent || '').trim() : ''; };
    let url = '';
    const enc = tag(n, 'enclosure'); if (enc) url = enc.getAttribute('url') || '';
    if (!url) { const mc = tag(n, 'media:content') || tag(n, 'content'); if (mc && mc.getAttribute('url')) url = mc.getAttribute('url'); }
    if (!url) { const l = n.querySelector('link[rel="enclosure"]'); if (l) url = l.getAttribute('href') || ''; }
    if (!url) { const l = tag(n, 'link'); if (l) { const h = l.getAttribute('href') || ''; const txt = (l.textContent || '').trim(); const cand = h || txt; if (/\.(mp3|m4a|aac|ogg|wav|opus)/i.test(cand)) url = cand; } }
    let dur = get('itunes:duration');
    let durSec = 0;
    if (dur) { if (dur.indexOf(':') > -1) { durSec = dur.split(':').reduce((a, b) => a * 60 + (+b || 0), 0); } else durSec = +dur || 0; }
    return {
      title: get('title') || 'Episode',
      url: url,
      date: get('pubDate') || get('published') || get('updated'),
      duration: durSec,
      desc: (get('description') || get('summary') || '').replace(/<[^>]+>/g, '').slice(0, 300)
    };
  }).filter((e) => e.url);
}

/* ---------- EPG ---------- */
function epgNow(item) {
  const map = STATE.epg; if (!map || !item) return '';
  let list = item.tvgId ? map[item.tvgId] : null;
  if (!list && STATE.epgNames) {
    const id = STATE.epgNames[normName(item.name)];
    if (id) list = map[id];
  }
  if (!list) return '';
  const now = Date.now();
  for (let i = 0; i < list.length; i++) { if (list[i].s <= now && list[i].e > now) return 'Now: ' + list[i].t; }
  return '';
}
function parseXMLTVDate(s) {
  if (!s) return 0;
  const m = /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?\s*([+-]\d{4})?/.exec(s.trim());
  if (!m) return 0;
  const iso = m[1] + '-' + m[2] + '-' + m[3] + 'T' + m[4] + ':' + m[5] + ':' + (m[6] || '00') + (m[7] ? m[7].slice(0, 3) + ':' + m[7].slice(3) : 'Z');
  return Date.parse(iso) || 0;
}
async function fetchEpgText(url) {
  const tryFetch = async (u) => {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 45000);
    try {
      const res = await fetch(u, { signal: ctl.signal, cache: 'no-store', credentials: 'omit' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const buf = await res.arrayBuffer();
      const b = new Uint8Array(buf);
      const gz = b.length > 2 && b[0] === 0x1f && b[1] === 0x8b;
      if (gz && typeof DecompressionStream !== 'undefined') {
        const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
        return await new Response(stream).text();
      }
      if (gz) throw new Error('gzip unsupported here');
      return new TextDecoder('utf-8').decode(buf);
    } finally { clearTimeout(t); }
  };
  try { return await tryFetch(url); }
  catch (e) { return await fetchText(url, { timeout: 45000 }); }
}
async function loadEPG(url, quiet) {
  if (!url) return toast('Set an XMLTV URL first');
  url = String(url).split(',')[0].trim();
  if (!quiet) toast('Loading TV guide…');
  try {
    const xml = await fetchEpgText(url);
    if (xml.length > 12 * 1024 * 1024) throw new Error('Guide too large');
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    if (doc.querySelector('parsererror')) throw new Error('Invalid XMLTV');
    const map = {}, names = {};
    Array.from(doc.querySelectorAll('channel')).forEach((c) => {
      const id = c.getAttribute('id'); if (!id) return;
      Array.from(c.querySelectorAll('display-name')).forEach((dn) => {
        const k = normName(dn.textContent);
        if (k && !names[k]) names[k] = id;
      });
    });
    const now = Date.now(), horizon = now + 18 * 3600e3;
    Array.from(doc.querySelectorAll('programme')).forEach((p) => {
      const ch = p.getAttribute('channel'); if (!ch) return;
      const s = parseXMLTVDate(p.getAttribute('start'));
      const e = parseXMLTVDate(p.getAttribute('stop'));
      if (!s || e < now - 3 * 24 * 3600e3 || s > horizon) return;
      const t = (p.querySelector('title') || {}).textContent || '';
      (map[ch] = map[ch] || []).push({ s: s, e: e || s + 1800e3, t: t.trim().slice(0, 90) });
    });
    Object.keys(map).forEach((k) => map[k].sort((a, b) => a.s - b.s));
    STATE.epg = map;
    STATE.epgNames = names;
    DB.epg = { url: url, data: map, ts: Date.now(), names: names };
    DB.settings.epgUrl = url;
    save(true);
    renderLive(); renderRadio();
    toast('Guide loaded for ' + Object.keys(map).length + ' channels');
  } catch (e) {
    if (!quiet) toast('EPG failed: ' + (e.message || 'error'));
  }
}

function homeState() {
  if (!DB.home || !Array.isArray(DB.home.order)) {
    DB.home = { order: HOME_SECTIONS.map((s) => s.id), on: {} };
    HOME_SECTIONS.forEach((s) => { DB.home.on[s.id] = true; });
  }
  DB.home.order = DB.home.order.filter((id) => HOME_SECTIONS.some((s) => s.id === id));
  HOME_SECTIONS.forEach((s) => { if (DB.home.order.indexOf(s.id) === -1) DB.home.order.push(s.id); });
  Object.keys(DB.home.on || {}).forEach((k) => { if (!HOME_SECTIONS.some((s) => s.id === k)) delete DB.home.on[k]; });
