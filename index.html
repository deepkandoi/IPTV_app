/* ============================================================
   TV guide grid
   ============================================================ */
const GUIDE_PX_MIN = 2.4;
function channelEpgId(ch) {
  if (!STATE.epg) return '';
  if (ch.tvgId && STATE.epg[ch.tvgId]) return ch.tvgId;
  if (STATE.epgNames) { const id = STATE.epgNames[normName(ch.name)]; if (id && STATE.epg[id]) return id; }
  return '';
}
function guideNowList(n) {
  if (!STATE.epg) return [];
  const now = Date.now(), out = [];
  STATE.channels.forEach((ch) => {
    const id = channelEpgId(ch); if (!id) return;
    const list = STATE.epg[id] || [];
    for (let i = 0; i < list.length; i++) {
      if (list[i].s <= now && list[i].e > now) { out.push({ ch: ch, prog: list[i] }); break; }
    }
  });
  out.sort((a, b) => (a.ch.num || 0) - (b.ch.num || 0));
  return out.slice(0, n || 12);
}
function guideRows() {
  const rows = [];
  STATE.channels.forEach((ch) => {
    const id = channelEpgId(ch); if (!id) return;
    const list = (STATE.epg[id] || []).filter((p) => p.e > Date.now() - 3600e3);
    if (list.length) rows.push({ ch: ch, id: id, list: list });
  });
  return rows;
}
function openGuide() {
  const g = $('#guide');
  if (!g) return;
  g.classList.add('open');
  document.body.classList.add('guide-open');
  renderGuide();
}
function closeGuide() {
  const g = $('#guide');
  if (g) g.classList.remove('open');
  document.body.classList.remove('guide-open');
}
function renderGuide() {
  const body = $('#gBody'); if (!body) return;
  const rows = guideRows();
  if (!rows.length) {
    body.innerHTML = emptyHTML('clock', 'No guide data', 'Load an XMLTV URL in Settings → Content → TV guide (EPG), then reopen the guide.');
    $('#gSub').textContent = 'no data';
    return;
  }
  const now = Date.now();
  const start = Math.floor((now - 30 * 60000) / 1800000) * 1800000;
  const end = start + 5 * 3600e3;
  const px = (t) => Math.round(((t - start) / 60000) * GUIDE_PX_MIN);
  const width = px(end);
  let ruler = '';
  for (let t = start; t < end; t += 1800000) {
    const d = new Date(t);
    ruler += '<div class="gtick" style="left:' + px(t) + 'px">' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) + '</div>';
  }
  const rowsHtml = rows.slice(0, 80).map((r) => {
    const blocks = r.list.filter((p) => p.e > start && p.s < end).map((p) => {
      const left = px(Math.max(p.s, start));
      const w = Math.max(28, px(Math.min(p.e, end)) - left - 2);
      const past = p.e < now;
      const live = p.s <= now && p.e > now;
      return '<div class="gprog' + (past ? ' past' : '') + (live ? ' live' : '') + '" style="left:' + left + 'px;width:' + w + 'px" ' +
        'data-gch="' + r.ch.id + '" data-gs="' + p.s + '" data-ge="' + p.e + '" data-gt="' + esc(p.t) + '">' +
        '<span class="gpt">' + esc(p.t) + '</span><span class="gpm">' + new Date(p.s).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) + '</span></div>';
    }).join('');
    return '<div class="grow"><div class="gchan" data-play="' + r.ch.id + '"><div class="glogo">' + plateHTML(r.ch, 'small') + '</div>' +
      '<span class="gcn">' + (r.ch.num ? r.ch.num + ' · ' : '') + esc(r.ch.name) + '</span></div>' +
      '<div class="gtrack" style="width:' + width + 'px">' + blocks + '</div></div>';
  }).join('');
  body.innerHTML = '<div class="gruler"><div class="gchan gh">' + rows.length + ' channels</div><div class="gtrack" style="width:' + width + 'px">' + ruler + '</div></div>' + rowsHtml;
  const line = document.createElement('div');
  line.className = 'gnow'; line.style.left = px(now) + 'px';
  body.querySelector('.gbody-inner') || null;
  $('#gSub').textContent = new Date(start).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) + ' — ' + new Date(end).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  body.insertAdjacentHTML('beforeend', '<div class="gnow" style="left:' + (px(now) + 132) + 'px"></div>');
  const sc = $('#gScroll');
  if (sc) sc.scrollLeft = Math.max(0, px(now) - 40);
  $$('[data-gch]', body).forEach((b) => b.addEventListener('click', () => {
    const ch = findItem(b.dataset.gch);
    if (!ch) return;
    const st = +b.dataset.gs, en = +b.dataset.ge;
    closeGuide();
    if (en < Date.now() && ch.catchup && ch.catchup.source) {
      const url = buildCatchupUrl(ch.catchup.source, { s: st, e: en, catchupType: ch.catchup.type });
      if (url) return playItem(Object.assign({}, ch, { id: ch.id + '-cu' + st, url: url, name: ch.name + ' · ' + b.dataset.gt }), []);
    }
    playItem(ch, STATE.channels);
  }));
  $$('[data-play]', body).forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const ch = findItem(b.dataset.play);
    if (ch) { closeGuide(); playItem(ch, STATE.channels); }
  }));
}

/* ============================================================
   Channel health check
   ============================================================ */
async function probeUrl(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 7000);
  try {
    await fetch(url, { mode: 'no-cors', signal: ctl.signal, cache: 'no-store', credentials: 'omit' });
    clearTimeout(t);
    return true;
  } catch (e) {
    clearTimeout(t);
    return false;
  }
}
let HC_STOP = false;
async function runHealthCheck() {
  const list = STATE.channels.slice(0, 60);
  if (!list.length) return toast('No channels to check');
  const dead = [];
  let done = 0;
  HC_STOP = false;
  openSheet('Checking channels', '<div class="ext-empty"><div class="spinner" style="margin:0 auto 14px"></div>' +
    '<div id="hcProg" style="font-family:var(--mono);font-size:12px">0 / ' + list.length + '</div>' +
    '<button class="btn sm" id="hcStop" style="margin-top:16px">Stop</button></div>', {
    onOpen: (root) => { const b = root.querySelector('#hcStop'); if (b) b.onclick = () => { HC_STOP = true; toast('Stopping…'); }; }
  });
  for (const ch of list) {
    if (HC_STOP) break;
    const ok = await probeUrl(ch.url, 7000);
    if (!ok) dead.push(ch);
    done++;
    const p = $('#hcProg');
    if (p) p.textContent = done + ' / ' + list.length + ' · ' + dead.length + ' unreachable';
  }
  if (!done) { closeSheet(); return toast('Check cancelled'); }
  DB.dead = dead.map((c) => c.id);
  save(true);
  if (!dead.length) {
    openSheet('Health check', emptyHTML('check', 'All ' + list.length + ' channels answered', 'No dead links found in the first ' + list.length + ' channels.'));
    return;
  }
  const rows = dead.map((c) => '<div class="row"><div class="av">' + plateHTML(c, 'small') + '</div>' +
    '<div class="rbody"><div class="rname">' + esc(c.name) + '</div><div class="rsub">' + esc(c.group) + '</div></div></div>').join('');
  openSheet('Health check', '<div style="padding:0 18px 10px;font-size:12px;color:var(--dim)">' + dead.length + ' of ' + list.length + ' did not answer within 7 seconds.</div>' +
    '<div class="rows" style="padding:0">' + rows + '</div>' +
    '<div style="padding:12px 16px 20px;display:flex;gap:8px"><button class="btn danger" style="flex:1" data-act="hc-hide">Hide these ' + dead.length + '</button>' +
    '<button class="btn" data-act="hc-close">Keep</button></div>', {
    onOpen: (root) => {
      const h = root.querySelector('[data-act="hc-hide"]');
      if (h) h.onclick = () => {
        dead.forEach((c) => { if (DB.hidden.indexOf(c.id) === -1) DB.hidden.push(c.id); });
        save(true); buildLibrary(); renderAll(); closeSheet(); toast(dead.length + ' hidden');
      };
      const c = root.querySelector('[data-act="hc-close"]');
      if (c) c.onclick = closeSheet;
    }
  });
}

   StreamBox: playback engine, controls, wiring, boot
   ============================================================ */
const CDN = {
  hls: ['https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js', 'https://unpkg.com/hls.js@1.5.17/dist/hls.min.js'],
  dash: ['https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js', 'https://unpkg.com/dashjs@4.7.4/dist/dash.all.min.js'],
  mpegts: ['https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js', 'https://unpkg.com/mpegts.js@1.7.3/dist/mpegts.js']
};
const libCache = {};
function loadLib(key, globalName) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  if (libCache[key]) return libCache[key];
  libCache[key] = new Promise((resolve, reject) => {
    const urls = CDN[key].slice();
    const next = () => {
      const url = urls.shift();
      if (!url) return reject(new Error(key + ' unavailable'));
      const s = document.createElement('script');
      s.src = url; s.async = true;
      s.onload = () => window[globalName] ? resolve(window[globalName]) : next();
      s.onerror = next;
      document.head.appendChild(s);
    };
    next();
  });
  return libCache[key];
}

const video = $('#video');
const P = { hls: null, dash: null, ts: null, item: null, list: [], idx: 0, retries: 0, fails: 0, hideT: null, watchdog: null, aspect: null, sleepT: null, statsT: null, altIdx: 0, engineTried: false, engineOverride: null, statTimer: null, drmChecked: false, gen: 0 };

}

function isHLS(u) { return /\.m3u8(\?|#|$)/i.test(u) || /[?&](type|format)=hls/i.test(u); }
function isDASH(u) { return /\.mpd(\?|#|$)/i.test(u); }

function isAudioKind(it) { return it && (it.kind === 'radio' || it.kind === 'pod'); }

async function openSeries(it) {
  const xt = it.xt || {};
  if (!xt.host) return toast('Series metadata missing — refresh the playlist');
  openSheet(it.name, '<div style="padding:0 18px 22px"><div class="spinner" style="margin:22px auto"></div></div>');
  try {
    const url = xt.host + '/player_api.php?username=' + encodeURIComponent(xt.user) + '&password=' + encodeURIComponent(xt.pass) + '&action=get_series_info&series_id=' + encodeURIComponent(xt.seriesId);
    const txt = await fetchText(url, { timeout: 25000 });
    const j = JSON.parse(txt);
    const eps = j.episodes || {};
    const flat = [];
    Object.keys(eps).forEach((season) => {
      (Array.isArray(eps[season]) ? eps[season] : []).forEach((e) => flat.push({
        season: +season, num: +(e.episode_num || 0), title: e.title || ('Episode ' + e.episode_num),
        id: e.id, ext: (e.container_extension || 'mp4'), dur: (e.info && e.info.duration) || ''
      }));
    });
    flat.sort((a, b) => a.season - b.season || a.num - b.num);
    if (!flat.length) throw new Error('No episodes listed');
    let html = '<div style="display:flex;gap:12px;padding:0 18px 14px;align-items:center">' +
      '<div class="av" style="width:60px;height:60px;border-radius:16px;background:var(--surface-3);overflow:hidden;display:grid;place-items:center">' +
      (it.logo ? '<img src="' + esc(it.logo) + '" style="width:100%;height:100%;object-fit:cover">' : icon('listVideo')) + '</div>' +
      '<div style="min-width:0"><div style="font-size:14px;font-weight:600">' + esc(it.name) + '</div>' +
      '<div style="font-size:11.5px;color:var(--dim);margin-top:2px">' + flat.length + ' episodes · ' + esc(it.group || 'Series') + '</div></div></div>';
    let lastSeason = null;
    html += '<div class="rows" style="padding:0">';
    flat.forEach((e, i) => {

function startStream(item, attempt) {
  const gen = P.gen;

  clearState();
  const url = item.url;

    externalPlayerError(url);
    return;
  }

  video.removeAttribute('src'); video.load();

  const engine = P.engineOverride || DB.settings.engine;

    capLevelToPlayerSize: true,
    maxBufferLength: DB.settings.buffer || 30,

    manifestLoadingTimeOut: (DB.settings.timeout || 20) * 1000,

    const snap = P.item;
    fetchText(url, { timeout: 7000, proxy: false }).then((head) => {
      if (looksEncrypted(head) && P.item === snap) {
        destroyEngines();
        showError('Protected stream (DRM)', 'This stream is encrypted with Widevine/PlayReady. A web page cannot open it without the provider\'s licence server and a native player. It will not play here — try a non-DRM source.');
      }
    }).catch(() => { });
  }
  const wantHls = (engine !== 'native') && isHLS(url);
  const nativeHls = video.canPlayType('application/vnd.apple.mpegurl');

  if (isDASH(url) && engine !== 'native') {
    loadLib('dash', 'dashjs').then((dashjs) => {
      if (!live()) return;
      try {
        loadingInfo(url, 'DASH.js');
      P.dash = dashjs.MediaPlayer().create();
        P.dash.initialize(video, url, DB.settings.autoplay);
        P.dash.updateSettings({ streaming: { delay: { liveDelay: DB.settings.lowLatency ? 2 : 4 } } });
        armWatchdog(item, attempt);
      } catch (e) { fallbackNative(url, item, attempt); }
    }).catch(() => fallbackNative(url, item, attempt));
    return;
  }
  if (wantHls && window.MediaSource) {
    loadLib('hls', 'Hls').then((Hls) => {
      if (!live()) return;
      if (!Hls || !Hls.isSupported()) return fallbackNative(url, item, attempt);
      P.hls = new Hls(hlsCfg);
      loadingInfo(url, 'HLS.js');
      P.hls.on(Hls.Events.MANIFEST_PARSED, () => { applyDefaultQuality(); if (DB.settings.autoplay) safePlay(); });
      P.hls.on(Hls.Events.ERROR, (evt, data) => {

        }
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR && P.retries < 1) {
          P.retries++;

        }
        handleFailure(item, attempt, data.type === Hls.ErrorTypes.NETWORK_ERROR ? 'Network error' : 'Playback error', gen);

      P.hls.attachMedia(video);
      armWatchdog(item, attempt);

    return;
  }

    loadLib('mpegts', 'mpegts').then((mpegts) => {
      if (!live()) return;

      loadingInfo(url, 'mpegts.js');
      P.ts = mpegts.createPlayer({ type: 'mse', isLive: true, url: url }, { enableWorker: true, lazyLoad: false, liveBufferLatencyChasing: true });
      P.ts.attachMediaElement(video);

      armWatchdog(item, attempt);
    }).catch(() => fallbackNative(url, item, attempt));
    return;
  }

  fallbackNative(url, item, attempt);
}

function applyDefaultQuality() {

  const target = +q;
  let best = -1;
  P.hls.levels.forEach((l, i) => {
    if (!l.height || l.height > target) return;

    '{duration}': Math.round((p.e - p.s) / 60000),

    '{eY}': en.getUTCFullYear(), '{em}': pad2(en.getUTCMonth() + 1), '{ed}': pad2(en.getUTCDate()),
    '{eH}': pad2(en.getUTCHours()), '{eM}': pad2(en.getUTCMinutes()), '{eS}': pad2(en.getUTCSeconds())

  let out = tpl;
  Object.keys(map).forEach((k) => { out = out.split(k).join(String(map[k])); });

/* ---------- live thumbnail previews ---------- */
const PV = { io: null, queue: [], active: [], max: 2, timer: null };

function startThumbPreviews() {
  const vids = $$('.thumbcard video.pv');
  if (!vids.length) return;
  if (PV.io) { try { PV.io.disconnect(); } catch (e) { } }
  if (!('IntersectionObserver' in window)) { vids.slice(0, PV.max).forEach(queuePreview); return; }
  PV.io = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      const v = en.target;
      if (en.isIntersecting) { if (!v.dataset.state) queuePreview(v); }
      else stopPreview(v);
    });
  }, { root: $('#content'), rootMargin: '180px 0px' });
  vids.forEach((v) => PV.io.observe(v));
  if (!PV.timer) PV.timer = setInterval(() => { if (document.hidden) PV.active.slice().forEach(stopPreview); }, 4000);
}

function stopAllPreviews() {
  try { PV.active.slice().forEach((v) => stopPreview(v)); } catch (e) { }
  PV.queue = [];
}
function queuePreview(v) {
  if (PV.queue.indexOf(v) > -1) return;
  PV.queue.push(v);
  pumpPreviews();
}
function pumpPreviews() {
  while (PV.active.length < PV.max && PV.queue.length) {
    const v = PV.queue.shift();
    if (!v || !v.isConnected) continue;
    PV.active.push(v);
    runPreview(v);
  }
}
async function runPreview(v) {
  const url = v.dataset.src;
  if (!url) return releasePreview(v);
  v.dataset.state = 'loading';
  try {
    if (isHLS(url) && DB.settings.engine !== 'native') {
      const Hls = await loadLib('hls', 'Hls').catch(() => null);
      if (Hls && Hls.isSupported()) {
        const h = new Hls({ enableWorker: true, autoStartLoad: true, maxBufferLength: 5, maxMaxBufferLength: 8, capLevelToPlayerSize: true, startLevel: -1 });
        h.loadSource(url); h.attachMedia(v);
        v._hls = h;
        h.on(Hls.Events.ERROR, (e, d) => { if (d && d.fatal) { v.dataset.state = 'fail'; releasePreview(v); } });
      } else { v.src = url; }
    } else { v.src = url; }
    v.muted = true;
    await v.play();
    v.dataset.state = 'on';
    v.classList.add('on');
    const card = v.closest('.card'); if (card) card.classList.add('previewing');
    clearTimeout(v._t);
    v._t = setTimeout(() => { try { v.pause(); } catch (e) { } releasePreview(v, true); }, 7000);
  } catch (e) {
    v.dataset.state = 'fail';
    releasePreview(v);
  }
}
function releasePreview(v, keepFrame) {
  const i = PV.active.indexOf(v);
  if (i > -1) PV.active.splice(i, 1);
  if (!keepFrame) stopPreview(v);
  pumpPreviews();
}
function stopPreview(v) {
  const i = PV.active.indexOf(v);
  if (i > -1) PV.active.splice(i, 1);
  clearTimeout(v._t);
  try { v.pause(); } catch (e) { }
  if (v._hls) { try { v._hls.destroy(); } catch (e) { } v._hls = null; }
  if (!v.dataset.state || v.dataset.state === 'loading') {
    try { v.removeAttribute('src'); v.load(); } catch (e) { }
  }
  v.classList.remove('on');
  const card = v.closest('.card'); if (card) card.classList.remove('previewing');
  delete v.dataset.state;
  pumpPreviews();
}

function statsPill() {

  try { if (video.buffered.length) buf = video.buffered.end(video.buffered.length - 1) - video.currentTime; } catch (e) { }
  let txt = (live ? 'LIVE' : 'VOD') + ' · buffer ' + buf.toFixed(1) + 's';
  if (P.hls) {
    if (typeof P.hls.latency === 'number') txt += ' · delay ' + P.hls.latency.toFixed(1) + 's';

/* ---------- media session ---------- */
function updateMediaSession() {
  if (!('mediaSession' in navigator) || !P.item) return;
  const it = P.item;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: it.name,
      artist: it.group || (it.kind === 'radio' ? 'Live radio' : 'StreamBox'),
      album: 'StreamBox',
      artwork: it.logo ? [{ src: it.logo, sizes: '512x512', type: 'image/png' }] : []
    });
    navigator.mediaSession.setActionHandler('play', () => safePlay());
    navigator.mediaSession.setActionHandler('pause', () => video.pause());
    navigator.mediaSession.setActionHandler('nexttrack', () => nextChannel(1));
    navigator.mediaSession.setActionHandler('previoustrack', () => nextChannel(-1));
  } catch (e) { }
}

});

video.addEventListener('timeupdate', () => {

video.addEventListener('loadedmetadata', () => {

  const d = video.duration;
  try { video.playbackRate = +DB.settings.speed || 1; } catch (e) { }
  if (!it || !DB.settings.resume || pos < 10) return;
  if (it.kind === 'pod' || (DB.settings.resumeVod && isFinite(d) && d > 120 && pos < d - 30)) {

    toast('Resumed at ' + fmtTime(pos));
  }
});
video.addEventListener('error', () => {

  const err = video.error;
  if (!err) return;
  if (err.code === 1) return; // aborted (we switched source)

document.addEventListener('click', (e) => {

  const pm = $('#pMenu');

  }
  const playEl = e.target.closest('[data-play]');

    const id = playEl.dataset.play;
    let it = findItem(id);

      if (r) it = Object.assign({ kind: r.kind || 'tv', group: 'Recent', name: r.name, url: r.url, logo: r.logo || '' }, r);

    const list = it.kind === 'radio' ? (STATE.radioList || STATE.radio) : (STATE.liveList || STATE.channels);
    if (DB.settings.hideAdult && /adult|xxx|18\+/i.test(it.name + ' ' + it.group)) {
      if (DB.settings.pin) return requirePin(() => handleItem(it, list));
    }
    if ($('#guide').classList.contains('open')) closeGuide();
    if ((STATE.q.home || '').trim() && STATE.tab === 'home') rememberSearch(STATE.q.home.trim());
    handleItem(it, list);
    return;
  }
  const podEl = e.target.closest('[data-pod]');
  if (podEl) { const p = STATE.pods.find((x) => x.id === podEl.dataset.pod); if (p) openPodcast(p); return; }

  const catEl = e.target.closest('[data-cat]');

    if (key === 'live') { STATE.liveShown = PAGE; renderLive(); }
    else if (key === 'radio') { STATE.radioShown = PAGE; renderRadio(); }
    else if (key === 'pod') renderPod();
    else renderLib();
    return;
  }
  if (e.target.closest('[data-more]')) {
    if (STATE.tab === 'radio') renderRadio(true); else renderLive(true);
    return;
  }
  const actEl = e.target.closest('[data-act]');
  if (actEl) { handleAction(actEl.dataset.act, actEl); return; }

  const unhide = e.target.closest('[data-unhide]');
  if (unhide) {
    DB.hidden = DB.hidden.filter((x) => x !== unhide.dataset.unhide);
    save(true); buildLibrary(); renderLib(); toast('Channel restored'); return;
  }
  const navBtn = e.target.closest('.navitem');
  if (navBtn) {
    const target = navBtn.dataset.view;
    if (target === 'settings' && DB.settings.pinOnSettings && DB.settings.pin) return requirePin(() => switchTab('settings'));
    switchTab(target); return;
  }

  const clr = e.target.closest('[data-clear]');
  if (clr) {
    const inp = $('#' + clr.dataset.clear);
    inp.value = ''; STATE.q[clr.dataset.clear.split('-')[1]] = '';
    clr.classList.add('hidden');
    if (clr.dataset.clear === 'q-home') { STATE.q.home = ''; renderHome(); }
    if (clr.dataset.clear === 'q-live') renderLive();
    if (clr.dataset.clear === 'q-radio') renderRadio();
    if (clr.dataset.clear === 'q-pod') renderPod();
    return;
  }
  const toggle = e.target.closest('[data-toggle]');
  if (toggle) {
    const key = toggle.dataset.toggle;
    DB.settings[key] = !DB.settings[key];
    toggle.querySelector('.switch').classList.toggle('on', DB.settings[key]);
    save(true);
    if (key === 'showLogos') { renderLive(); renderRadio(); }
    return;
  }
  if (e.target.closest('#scrim')) { closeSheet(); closeDialog(); return; }
});

/* gestures: double-tap seek, long-press 2x, vertical swipe for volume */
(function initGestures() {
  const stage = $('#pStage');
  let lastTap = 0, startY = 0, startVol = 1, longT = null, swiping = false, moved = false;
  stage.addEventListener('touchstart', (e) => {
    if (!DB.settings.gestures || e.touches.length !== 1) return;
    const t = e.touches[0];
    startY = t.clientY; startVol = video.volume; swiping = false; moved = false;
    longT = setTimeout(() => {
      if (moved) return;
      video.playbackRate = 2;
      toast('2× speed');
    }, 550);
  }, { passive: true });
  stage.addEventListener('touchmove', (e) => {
    if (!DB.settings.gestures || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dy = t.clientY - startY;
    if (Math.abs(dy) > 18) { moved = true; clearTimeout(longT); }
    if (moved && t.clientX > window.innerWidth * 0.5 && !e.target.closest('.pmenu')) {
      swiping = true;
      const v = Math.min(1, Math.max(0, startVol - dy / 260));
      video.volume = v;
      if (video.muted) video.muted = false;
    }
  }, { passive: true });
  stage.addEventListener('touchend', (e) => {
    if (!DB.settings.gestures) return;
    clearTimeout(longT);
    if (video.playbackRate === 2) { video.playbackRate = +DB.settings.speed || 1; }
    if (swiping) { toast('Volume ' + Math.round(video.volume * 100) + '%'); swiping = false; return; }
    if (moved) return;
    const now = Date.now();
    const t = (e.changedTouches && e.changedTouches[0]) || {};
    const x = t.clientX || 0;
    if (now - lastTap < 300) {
      const d = video.duration;
      if (isFinite(d) && d > 0) {
        try {
          if (x < window.innerWidth * 0.4) { video.currentTime = Math.max(0, video.currentTime - 10); toast('-10s'); }
          else if (x > window.innerWidth * 0.6) { video.currentTime = Math.min(d, video.currentTime + 10); toast('+10s'); }
        } catch (err) { }
      } else toast('Seeking is not available on a live stream');
      lastTap = 0;
    } else lastTap = now;
  }, { passive: true });
})();

      if (q === 'group') addToGroup(it);
      if (q === 'copy') navigator.clipboard.writeText(it.url).then(() => toast('URL copied')).catch(() => toast('Copy failed'));
      if (q === 'open') window.open(it.url, '_blank', 'noopener');
      if (q === 'hide') { if (DB.hidden.indexOf(it.id) === -1) DB.hidden.push(it.id); save(true); buildLibrary(); renderAll(); toast('Hidden'); }
    }))
  });
}

/* ---------- boot ---------- */
function boot() {
  if (window.__booted) return;
  window.__booted = true;
  loadDB();
  applyTheme();
  $('#brandIcon').innerHTML = icon('tv');
  $('#splashIcon').innerHTML = icon('tv');
  $('#verTxt').textContent = APP_VERSION;
  $('#liveLayout').innerHTML = icon(LAYOUT_ICON[DB.settings.layout] || 'eye');
  paintIcons(document);
  applyLang();
  const presetsChanged = ensurePresets();
  buildLibrary();
  renderAll();
  let landing = DB.tab || 'home';
  if (DB.firstRun && DB.settings.exploreHome !== false) landing = 'home';
  if (landing === 'home' && DB.settings.exploreHome === false) landing = 'live';
  if (landing === 'settings') landing = 'live';
  switchTab(landing, true);

  window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (DB.settings.theme === 'system') applyTheme(); });

  setTimeout(() => $('#splash').classList.add('gone'), 620);

  /* installable PWA shell (works when served over http/https) */
  try {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0e1113"/><rect x="96" y="150" width="320" height="212" rx="34" fill="#3ddc84"/><path d="M196 118l60 44 60-44" stroke="#3ddc84" stroke-width="26" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M232 226l88 30-88 30z" fill="#04240f"/></svg>';
    const iconUrl = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    const mf = {
      name: 'StreamBox — Live TV, Radio & Podcasts', short_name: 'StreamBox',
      start_url: '.', scope: '.', display: 'standalone', orientation: 'any',
      background_color: '#0e1113', theme_color: '#0e1113',
      icons: [{ src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));
    document.head.appendChild(link);
    const ai = document.createElement('link');
    ai.rel = 'apple-touch-icon'; ai.href = iconUrl;
    document.head.appendChild(ai);
  } catch (e) { }

  if (DB.settings.epgUrl && !DB.epg.data) setTimeout(() => loadEPG(DB.settings.epgUrl, true), 2500);
  if (DB.settings.autoRefresh !== false) setTimeout(autoRefreshSources, 3500);
  const phoenix = DB.sources.find((s) => s.url === PHOENIX_URL);
  if (phoenix && (!phoenix.items || presetsChanged)) {
    setTimeout(() => refreshSource(phoenix), presetsChanged ? 1200 : 2500);
  }

  if (DB.firstRun) {
    DB.firstRun = false; save(true);
    setTimeout(() => {
      if ($('#sheet').classList.contains('show') || $('#dialog').classList.contains('show')) return;
      openSheet('Welcome to StreamBox', '<div style="padding:0 18px 22px;font-size:13.5px;line-height:1.65;color:var(--dim)">' +
      '<p style="color:var(--text);margin:0 0 10px">' + STATE.channels.length + ' India TV channels and ' + STATE.radio.length + ' radio stations are already installed — just tap to play.</p>' +
      '<p>Everything else is one tap away: add your own M3U or Xtream playlist in Settings, sync 500+ more radio stations, or drop in a podcast RSS feed.</p>' +
      '<p style="font-size:11.5px;color:var(--dimmer)">Tip: long-press any channel for quick actions.</p>' +
      '<button class="btn primary block" style="margin-top:14px" data-act="welcome-close">Start watching</button></div>', {
      onOpen: (root) => { const b = root.querySelector('[data-act="welcome-close"]'); if (b) b.onclick = closeSheet; }
      });
    }, 1200);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) save(true);
  });
  window.addEventListener('beforeunload', () => save(true));
}
document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();


</script>
</body>
